<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title data-i18n="pageTitle"></title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Mrs+Saint+Delafield&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="page-frame" aria-hidden="true"></div>

<nav>
  <div class="wrap">

    <div class="nav-name" data-i18n="navName"></div>

    <ul class="nav-links" id="navLinks">
      <li><a href="#programme" data-i18n="navProgramme"></a></li>
      <li><a href="#itineraire" data-i18n="navItineraire"></a></li>
      <li><a href="#logement" data-i18n="navLogement"></a></li>
      <li><a href="#galerie" data-i18n="navGalerie"></a></li>
      <li><a href="#infos" data-i18n="navInfos"></a></li>
      <li><a href="#cagnotte" data-i18n="navCagnotte"></a></li>
      <li><a href="#rsvp" data-i18n="navRsvp"></a></li>
    </ul>

    <div class="nav-right">

      <div class="lang-toggle">
        <button type="button" class="lang-btn active" data-lang-btn="fr">FR</button>
        <span class="lang-sep">/</span>
        <button type="button" class="lang-btn" data-lang-btn="en">EN</button>
      </div>

      <button
        class="nav-toggle"
        id="navToggle"
        type="button"
        data-i18n-aria-label="navOpen"
      >☰</button>

    </div>
  </div>
</nav>


<!-- HERO -->

<header class="hero">

  <!-- Tes deux SVG hero-branch restent ici exactement comme actuellement -->

  <p class="hero-eyebrow" data-i18n="heroEyebrow"></p>

  <h1>
    <span data-i18n="coupleName1"></span>
    <span class="amp">&amp;</span>
    <span data-i18n="coupleName2"></span>
  </h1>

  <p class="hero-invite" data-i18n="heroInvite"></p>

  <div class="rule"></div>

  <p class="hero-date" data-i18n="heroDate"></p>

  <p class="hero-venue" data-i18n="heroVenue"></p>

  <p class="hero-scroll" data-i18n="heroScroll"></p>

</header>


<!-- PROGRAMME -->

<section id="programme" class="bloom-section">

  <!-- SVG décoration -->

  <div class="wrap">

    <div class="section-head">

      <!-- SVG bouquet -->

      <h2 data-i18n="progH2"></h2>
      <p data-i18n="progP"></p>

    </div>

    <div class="timeline">

      <div class="t-item">
        <div class="t-time" data-i18n="t1Time"></div>
        <div class="t-body">
          <h3 data-i18n="t1Title"></h3>
          <p data-i18n="t1Desc"></p>
        </div>
      </div>

      <div class="t-item">
        <div class="t-time" data-i18n="t2Time"></div>
        <div class="t-body">
          <h3 data-i18n="t2Title"></h3>
          <p data-i18n="t2Desc"></p>
        </div>
      </div>

      <div class="t-item">
        <div class="t-time" data-i18n="t3Time"></div>
        <div class="t-body">
          <h3 data-i18n="t3Title"></h3>
          <p data-i18n="t3Desc"></p>
        </div>
      </div>

      <div class="t-item">
        <div class="t-time" data-i18n="t4Time"></div>
        <div class="t-body">
          <h3 data-i18n="t4Title"></h3>
          <p data-i18n="t4Desc"></p>
        </div>
      </div>

    </div>
  </div>
</section>


<!-- ITINERAIRE / LOGEMENT -->

<section id="itineraire" class="bloom-section section-alt">

  <!-- SVG décoration -->

  <div class="wrap">

    <div class="section-head">
      <!-- SVG bouquet -->
      <h2 data-i18n="itinH2"></h2>
      <p data-i18n="itinP"></p>
    </div>

    <div class="info-grid">

      <div class="info-block">

        <h3 data-i18n="itinBlockH3"></h3>

        <p data-i18n="venueAddress"></p>
        <p data-i18n="itinP2"></p>
        <p data-i18n="itinP3"></p>

      </div>

      <div class="info-block" id="logement">

        <h3 data-i18n="logeH3"></h3>

        <div class="place-card">
          <div class="name" data-i18n="place1Name"></div>
          <div class="meta" data-i18n="place1"></div>
        </div>

        <div class="place-card">
          <div class="name" data-i18n="place2Name"></div>
          <div class="meta" data-i18n="place2"></div>
        </div>

        <div class="place-card">
          <div class="name" data-i18n="place3Name"></div>
          <div class="meta" data-i18n="place3"></div>
        </div>

      </div>

    </div>
  </div>
</section>


<!-- GALERIE -->

<section id="galerie" class="bloom-section">

  <!-- SVG décoration -->

  <div class="wrap">

    <div class="section-head">
      <!-- SVG bouquet -->
      <h2 data-i18n="galH2"></h2>
      <p data-i18n="galP"></p>
    </div>

    <h3 class="gallery-sub" data-i18n="galSubVenue"></h3>

    <div class="gallery">
      <div class="g-item" data-i18n="galItemVenue"></div>
    </div>

    <h3 class="gallery-sub" data-i18n="galSubUs"></h3>

    <div class="gallery gallery-couple">
      <div class="g-item tall" data-i18n="galItemUs"></div>
      <div class="g-item" data-i18n="galItemUs"></div>
      <div class="g-item" data-i18n="galItemUs"></div>
    </div>

  </div>
</section>


<!-- INFOS -->

<section id="infos" class="bloom-section section-alt">

  <!-- SVG décoration -->

  <div class="wrap">

    <div class="section-head">
      <!-- SVG bouquet -->
      <h2 data-i18n="infosH2"></h2>
      <p data-i18n="infosP"></p>
    </div>

    <div class="practical">

      <div class="practical-card">
        <h3 data-i18n="tenueH3"></h3>
        <p data-i18n="tenueP"></p>
      </div>

      <div class="practical-card">
        <h3 data-i18n="enfantsH3"></h3>
        <p data-i18n="enfantsP"></p>
      </div>

      <div class="practical-card">
        <h3 data-i18n="listeH3"></h3>
        <p data-i18n="listeP"></p>
      </div>

      <div class="practical-card">
        <h3 data-i18n="contactH3"></h3>
        <p data-i18n="contactP"></p>
      </div>

    </div>
  </div>
</section>


<!-- CAGNOTTE -->

<section id="cagnotte" class="bloom-section">

  <!-- SVG décoration -->

  <div class="wrap">

    <div class="section-head">
      <!-- SVG bouquet -->
      <h2 data-i18n="cagH2"></h2>
      <p data-i18n="cagP"></p>
    </div>

    <div class="cagnotte-card">

      <!-- SVG -->

      <h3 data-i18n="cagCardH3"></h3>
      <p data-i18n="cagCardP"></p>

      <a href="#" class="cagnotte-btn" data-i18n="cagBtn"></a>

      <p class="cagnotte-note" data-i18n="cagNote"></p>

    </div>
  </div>
</section>


<!-- RSVP -->

<section id="rsvp" class="bloom-section">

  <!-- SVG décoration -->

  <div class="wrap">

    <div class="section-head">
      <!-- SVG bouquet -->
      <h2 data-i18n="rsvpH2"></h2>
      <p data-i18n="rsvpP"></p>
    </div>

    <form
      class="rsvp-form"
      id="rsvpForm"
      action="https://formspree.io/f/mppzland"
      method="POST"
    >

      <input
        type="hidden"
        name="_subject"
        data-i18n-value="formSubject"
      >

      <div class="field-row">

        <div class="field">
          <label for="fullname" data-i18n="lblName"></label>
          <input type="text" id="fullname" name="fullname" required>
        </div>

        <div class="field">
          <label for="email" data-i18n="lblEmail"></label>
          <input type="email" id="email" name="email" required>
        </div>

      </div>

      <div class="field-row">

        <div class="field">

          <label for="attending" data-i18n="lblAttending"></label>

          <select id="attending" name="attending" required>
            <option value="" data-i18n="optChoose"></option>
            <option value="oui" data-i18n="optYes"></option>
            <option value="non" data-i18n="optNo"></option>
          </select>

        </div>

        <div class="field">

          <label for="guests" data-i18n="lblGuests"></label>

          <input
            type="number"
            id="guests"
            name="guests"
            min="1"
            max="6"
            value="1"
          >

        </div>

      </div>

      <div class="field">

        <label for="meal" data-i18n="lblMeal"></label>

        <select id="meal" name="meal">
          <option value="standard" data-i18n="optMealStd"></option>
          <option value="vegetarien" data-i18n="optMealVeg"></option>
          <option value="vegan" data-i18n="optMealVegan"></option>
          <option value="allergie" data-i18n="optMealAllergy"></option>
        </select>

      </div>

      <div class="field">

        <label for="message" data-i18n="lblMessage"></label>

        <textarea
          id="message"
          name="message"
          data-i18n-placeholder="phMessage"
        ></textarea>

      </div>

      <button
        type="submit"
        class="rsvp-submit"
        data-i18n="rsvpSubmit"
      ></button>

    </form>

    <div class="rsvp-confirm" id="rsvpConfirm">
      <h3 data-i18n="rsvpThanks"></h3>
      <p id="rsvpConfirmText"></p>
    </div>

  </div>
</section>


<footer>

  <span class="script script-name" data-i18n="footerName"></span>

  <p data-i18n="footerText"></p>

</footer>


<script src="js/translations.js"></script>

</body>
</html>

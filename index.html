      rsvpYes:"{name}, we can't wait to celebrate this day with you.",
      rsvpNo:"{name}, thank you for letting us know — you'll be with us in spirit.",
      footerText:"With all our love, see you soon."
    }
  };

  let currentLang = 'fr';

  function applyLang(lang){
    currentLang = lang;
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const key = el.getAttribute('data-i18n');
      const val = translations[lang][key];
      if(val !== undefined) el.innerHTML = val;
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
      const key = el.getAttribute('data-i18n-placeholder');
      const val = translations[lang][key];
      if(val !== undefined) el.placeholder = val;
    });
    document.querySelectorAll('.lang-btn').forEach(b=>{
      b.classList.toggle('active', b.getAttribute('data-lang-btn') === lang);
    });
  }

  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.addEventListener('click', ()=> applyLang(b.getAttribute('data-lang-btn')));
  });

  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => navLinks.classList.toggle('open'));
  navLinks.querySelectorAll('a').forEach(a => a.addEventListener('click', () => navLinks.classList.remove('open')));

  const form = document.getElementById('rsvpForm');
  const confirmBox = document.getElementById('rsvpConfirm');
  const confirmText = document.getElementById('rsvpConfirmText');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    const name = document.getElementById('fullname').value.trim();
    const attending = document.getElementById('attending').value;
    const submitButton = form.querySelector('button[type="submit"]');

    submitButton.disabled = true;

    try {
      const response = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: {
          'Accept': 'application/json'
        }
      });

      if (!response.ok) {
        throw new Error('Erreur Formspree');
      }

      form.style.display = 'none';
      confirmBox.style.display = 'block';

      const template = attending === 'oui'
        ? translations[currentLang].rsvpYes
        : translations[currentLang].rsvpNo;

      confirmText.textContent = template.replace('{name}', name);

    } catch (error) {
      console.error(error);

      alert(
        currentLang === 'fr'
          ? "Une erreur est survenue. Votre réponse n'a pas pu être envoyée. Veuillez réessayer."
          : "Something went wrong. Your response could not be sent. Please try again."
      );

      submitButton.disabled = false;
    }
  });

  // Rend le contenu au chargement (évite le HTML dupliqué et garantit
  // que la langue affichée correspond toujours à l'objet translations).
  applyLang(currentLang);
</script>
